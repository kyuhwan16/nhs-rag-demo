function tokenize(text){
  return text.toLowerCase()
    .replace(/[^a-z0-9\s']/g, " ")
    .split(/\s+/)
    .filter(t => t.length > 1 && !STOPWORDS.has(t));
}

function buildVocab(tokenizedDocs){
  const vocab = new Map();
  tokenizedDocs.forEach(tokens => {
    tokens.forEach(t => { if(!vocab.has(t)) vocab.set(t, vocab.size); });
  });
  return vocab;
}

function tfidfVectors(tokenizedDocs){
  const vocab = buildVocab(tokenizedDocs);
  const N = tokenizedDocs.length;
  const df = new Array(vocab.size).fill(0);

  const rawCounts = tokenizedDocs.map(tokens => {
    const counts = new Array(vocab.size).fill(0);
    tokens.forEach(t => { counts[vocab.get(t)] += 1; });
    return counts;
  });

  rawCounts.forEach(counts => {
    counts.forEach((c, i) => { if(c > 0) df[i] += 1; });
  });

  // smooth idf, matches sklearn default: idf = ln((1+N)/(1+df)) + 1
  const idf = df.map(d => Math.log((1 + N) / (1 + d)) + 1);

  const vectors = rawCounts.map(counts => {
    const v = counts.map((c, i) => c * idf[i]);
    const norm = Math.sqrt(v.reduce((s, x) => s + x * x, 0)) || 1;
    return v.map(x => x / norm);
  });

  return { vocab, idf, vectors };
}

function vectorizeQuery(tokens, vocab, idf){
  const v = new Array(vocab.size).fill(0);
  tokens.forEach(t => { if(vocab.has(t)) v[vocab.get(t)] += 1; });
  const withIdf = v.map((c, i) => c * idf[i]);
  const norm = Math.sqrt(withIdf.reduce((s, x) => s + x * x, 0)) || 1;
  return withIdf.map(x => x / norm);
}

function cosineSim(a, b){
  let dot = 0;
  for(let i = 0; i < a.length; i++) dot += a[i] * b[i];
  return dot;
}

const docTokens = KB.map(d => tokenize(d.text));
const { vocab: docVocab, idf: docIdf, vectors: docVectors } = tfidfVectors(docTokens);

function retrieve(query){
  const qTokens = tokenize(query);
  const qVec = vectorizeQuery(qTokens, docVocab, docIdf);
  const scores = docVectors.map(v => cosineSim(qVec, v));
  let bestIdx = 0;
  // making sure this still falls back to bestIdx=0 when every score is 0
  scores.forEach((s, i) => { if(s > scores[bestIdx]) bestIdx = i; });
  return { doc: KB[bestIdx], score: scores[bestIdx] };
}
